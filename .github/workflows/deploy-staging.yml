name: Staging Deployment

on:
  push:
    branches: [ "staging" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/metrics-server:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Staging via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker network create aws_backend || true
            docker pull qarani/metrics-server:staging
            docker stop metrics-server-staging || true
            docker rm metrics-server-staging || true
            docker run -d --name metrics-server-staging \
              --network aws_backend \
              -p 8085:8085 \
              -e APP_PROFILE=staging \
              -e DB_HOST=postgres-staging \
              -e DB_PORT=5432 \
              -e DB_USER=${{ secrets.STAGING_DB_USER }} \
              -e DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }} \
              -e DB_NAME=metrics_db \
              -e NATS_URL=nats://nats-staging:4222 \
              -e NATS_USER=auth-server \
              -e NATS_PASSWORD=auth-secret \
              -e INSTANCE_TOKEN_SECRET=${{ secrets.STAGING_INSTANCE_TOKEN_SECRET }} \
              -e HTTP_PORT=8085 \
              qarani/metrics-server:staging